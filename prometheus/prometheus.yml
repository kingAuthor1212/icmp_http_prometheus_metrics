global:
  scrape_interval: 15s
  evaluation_interval: 10s

rule_files:
  - ./rules/rules.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs: 
      - targets: ["localhost:9090"]
  # scrape for go application
  - job_name: "goApplication"
    static_configs:
      - targets: ["localhost:8080"]

  # for node exporter
  - job_name: "node_exporter"
    static_configs:
      - targets: ["localhost:9100"]
